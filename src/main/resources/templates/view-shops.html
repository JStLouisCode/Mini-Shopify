<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Shops</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>All Shops</h1>
        <p>Browse every shop you have created so far.</p>
    </div>

    <div th:if="${#lists.isEmpty(shops)}" class="empty-state">
        <h3>No Shops Available</h3>
        <p>Create your first shop to see it listed here.</p>
        <a href="/create-shop" class="btn">Create Shop</a>
    </div>

    <div th:if="${!#lists.isEmpty(shops)}" class="shop-list">
        <div th:each="shop : ${shops}" class="shop-card">
            <div class="shop-info">
                <h2 th:text="${shop.name}">Shop Name</h2>
                <div class="shop-meta">
                    <span class="badge"
                          th:if="${shop.tags != null and !#strings.isEmpty(shop.tags)}"
                          th:text="${shop.tags}">Tags</span>
                    <span class="shop-type"
                          th:if="${shop.businessType != null and !#strings.isEmpty(shop.businessType)}"
                          th:text="${shop.businessType}">Business Type</span>
                </div>
                <p class="shop-description"
                   th:text="${shop.description != null and !#strings.isEmpty(shop.description) ? shop.description : 'No description available'}">
                    Description
                </p>
            </div>
            <div class="shop-details">
                <p><strong>Preferred Currency:</strong>
                    <span th:text="${shop.currency != null and !#strings.isEmpty(shop.currency) ? shop.currency : 'Not specified'}">USD</span>
                </p>
                <p><strong>Contact:</strong>
                    <span th:text="${shop.contact != null and !#strings.isEmpty(shop.contact) ? shop.contact : 'Not provided'}">contact@email.com</span>
                </p>
                <p><strong>Social Media:</strong>
                    <span th:text="${shop.socialMediaLinks != null and !#strings.isEmpty(shop.socialMediaLinks) ? shop.socialMediaLinks : 'Not provided'}">@shop</span>
                </p>
            </div>
        </div>
    </div>

    <div class="actions">
        <a href="/" class="btn btn-secondary">&larr; Back to Home</a>
        <a href="/create-shop" class="btn">Create Another Shop</a>
    </div>
</div>
</body>
</html>
