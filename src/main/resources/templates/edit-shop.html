<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Shop</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        select[multiple] {
            height: 150px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Edit Shop</h1>
        <p>Update your shop's information</p>
    </div>
    <form th:action="@{/edit-shop/{id}(id=${shop.shopId})}" th:object="${shop}" method="post">

        <div class="form-group">
            <label for="name">Shop Name *</label>
            <input type="text" id="name" th:field="*{name}" required/>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" rows="4" placeholder="Describe your shop..."></textarea>
        </div>
        <div class="form-group">
            <label for="businessType">Business Type</label>
            <select id="businessType" th:field="*{businessType}">
                <option value="">Select a Business Type</option>
                <option th:each="type : ${allBusinessTypes}"
                        th:value="${type}"
                        th:text="${type}">
                </option>
            </select>
        </div>
        <div class="form-group">
            <label for="tags">Tags</label>
            <select id="tags" th:field="*{tags}" multiple>
                <option th:each="tag : ${allTags}"
                        th:value="${tag}"
                        th:text="${tag}">
                </option>
            </select>
            <small>Hold Ctrl/Cmd to select multiple</small>
        </div>

        <div class="form-group">
            <label for="currency">Currency</label>
            <select id="currency" th:field="*{currency}" required>
                <option value="">Select Currency</option>
                <option th:each="entry : ${allCurrencies}"
                        th:value="${entry.key}"
                        th:text="${entry.value}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="contact">Contact Email</label>
            <input type="email" id="contact" th:field="*{contact}" placeholder="contact@example.com"/>
        </div>
        <div class="form-group">
            <label for="socialMediaLinks">Social Media Links</label>
            <input type="text" id="socialMediaLinks" th:field="*{socialMediaLinks}" placeholder="e.g., @yourshop, facebook.com/yourshop"/>
        </div>
        <div class="button-group">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a th:href="@{/select-shop}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
