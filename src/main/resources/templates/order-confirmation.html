<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family:'Inter',sans-serif; background:#f9fafb; color:#1f2937; padding:40px; }
        .container { max-width:800px; margin:0 auto; }
        .card { background:white; border-radius:12px; padding:30px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { text-align:center; margin-bottom:10px; }
        .subtitle { text-align:center; color:#6b7280; margin-bottom:20px; }
        table { width:100%; border-collapse:collapse; margin-top:20px; }
        th, td { padding:8px 0; border-bottom:1px solid #e5e7eb; text-align:left; }
        th { font-weight:600; }
        .total-row { font-weight:700; }
        .meta { margin-top:10px; color:#6b7280; font-size:0.9rem; }
        .btn-row { margin-top:25px; text-align:center; }
        .btn { padding:10px 20px; border-radius:8px; border:none; font-weight:600; cursor:pointer; text-decoration:none; }
        .btn-primary { background:#2563eb; color:white; }
        .btn-secondary { background:#e5e7eb; color:#374151; margin-right:10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Thank you for your purchase!</h1>
        <div class="subtitle">
            Order <strong>#<span th:text="${order.id}">123</span></strong>
            • <span th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">2025-01-01</span>
        </div>

        <div class="meta">
            <div>Customer: <span th:text="${order.customerName}">Name</span></div>
            <div>Email: <span th:text="${order.customerEmail}">email@example.com</span></div>
            <div th:if="${order.shopName != null}">
                Shop: <span th:text="${order.shopName}">Shop Name</span>
            </div>
        </div>

        <table>
            <thead>
            <tr>
                <th>Product</th>
                <th>Qty</th>
                <th>Line Total</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${order.items}">
                <td th:text="${item.productName}">Product</td>
                <td th:text="${item.quantity}">1</td>
                <td>
                    <span th:text="${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                    <span th:text="${order.currency} ?: 'CAD'">CAD</span>
                </td>
            </tr>
            </tbody>
            <tfoot>
            <tr class="total-row">
                <td colspan="2">Total</td>
                <td>
                    <span th:text="${#numbers.formatDecimal(order.totalPrice, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                    <span th:text="${order.currency} ?: 'CAD'">CAD</span>
                </td>
            </tr>
            </tfoot>
        </table>

        <div class="btn-row">
            <a href="/view-existing-shops" class="btn btn-secondary">Back to Shops</a>
            <a th:if="${order.shopId != null}" th:href="@{'/shop/' + ${order.shopId}}" class="btn btn-primary">
                Back to this Shop
            </a>
        </div>
    </div>
    <div class="btn-row">
        <a href="/orders" class="btn btn-primary"
           style="margin-top:20px; text-decoration:none;">
            View All Orders
        </a>
    </div>
</div>
</body>
</html>
