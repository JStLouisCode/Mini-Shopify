<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            color: #1f2937;
            padding: 40px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; }

        .cart-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .cart-table th, .cart-table td { padding: 15px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        .cart-table th { background-color: #f3f4f6; font-weight: 600; }

        .total-section {
            text-align: right;
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn { padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-secondary { background-color: #e5e7eb; color: #374151; }
    </style>
</head>
<body>
<div class="container">
    <h1>Your Shopping Cart</h1>

    <div th:if="${#lists.isEmpty(cartItems)}">
        <p style="text-align: center; color: #6b7280;">Your cart is empty.</p>
        <div style="text-align: center; margin-top: 20px;">
            <a href="/" class="btn btn-secondary">Go Shopping</a>
        </div>
    </div>

    <div th:if="${!#lists.isEmpty(cartItems)}">
        <table class="cart-table">
            <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cartItems}">
                <td th:text="${item.product.productName}">Product</td>
                <td th:text="${item.product.productPrice}">0.00</td>
                <td th:text="${item.quantity}">1</td>
                <td th:text="${item.totalPrice}">0.00</td>
            </tr>
            </tbody>
        </table>

        <div class="total-section">
            Total: <span th:text="${total}">0.00</span>
        </div>

        <div class="actions">
            <a href="/" class="btn btn-secondary">Continue Shopping</a>
            <a href="/cart/checkout" class="btn btn-primary">Proceed to Checkout</a>
        </div>
    </div>
</div>
</body>
</html>
