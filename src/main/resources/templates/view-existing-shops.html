<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Existing Shops</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Existing Shops</h1>

    <div th:if="${shops.isEmpty()}" class="no-shops">
        <p>No shops found. <a th:href="@{/create-shop}">Create your first shop</a></p>
    </div>

    <div th:if="${!shops.isEmpty()}" class="shops-list">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Business Type</th>
                <th>Description</th>
                <th>Tags</th>
                <th>Currency</th>
                <th>Contact</th>
                <th>Social Media</th>
                <th>Products</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="shop : ${shops}">
                <td th:text="${shop.shopId}">1</td>
                <td th:text="${shop.name}">Shop Name</td>
                <td th:text="${shop.businessType}">Business Type</td>
                <td th:text="${shop.description}">Description</td>
                <td th:text="${shop.tags}">Tags</td>
                <td th:text="${shop.currency}">Currency</td>
                <td th:text="${shop.contact}">Contact</td>
                <td th:text="${shop.socialMediaLinks}">Social Media</td>
                <td>
                    <a th:href="@{'/shop/' + ${shop.shopId}}" class="btn">View Products</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="actions">
        <a th:href="@{/create-shop}" class="btn">Create New Shop</a>
        <a th:href="@{/}" class="btn">Back to Home</a>
    </div>
</div>
</body>
</html>
