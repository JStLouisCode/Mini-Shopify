<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Existing Shops</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .search-container {
            margin: 20px 0 30px 0;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        .search-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        .search-type-selector {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .search-type-selector label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
            cursor: pointer;
        }

        .search-type-selector input[type="radio"] {
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Existing Shops</h1>

    <!-- Search Section -->
    <div class="search-container">
        <form action="/search-results" method="get" class="search-form">
            <input type="text"
                   name="query"
                   class="search-input"
                   placeholder="Search by shop name or tag..."
                   required>
            <button type="submit" class="btn btn-primary">Search</button>
        </form>

        <div class="search-type-selector">
            <span>Search by:</span>
            <label>
                <input type="radio" name="type" value="name" checked> Shop Name
            </label>
            <label>
                <input type="radio" name="type" value="tag"> Tag
            </label>
        </div>
    </div>

    <div th:if="${shops.isEmpty()}" class="no-shops">
        <p>No shops found. <a th:href="@{/create-shop}">Create your first shop</a></p>
    </div>

    <div th:if="${!shops.isEmpty()}" class="shops-list">
        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Business Type</th>
                    <th>Description</th>
                    <th>Tags</th>
                    <th>Currency</th>
                    <th>Contact</th>
                    <th>Social Media</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="shop : ${shops}">
                    <td th:text="${shop.shopId}">1</td>
                    <td th:text="${shop.name}">Shop Name</td>
                    <td th:text="${shop.businessType}">Business Type</td>
                    <td class="truncate" th:text="${shop.description}" th:title="${shop.description}">Description</td>
                    <td class="truncate" th:text="${#strings.listJoin(shop.tags, ', ')}" th:title="${#strings.listJoin(shop.tags, ', ')}">Tags</td>
                    <td th:text="${shop.currency}">Currency</td>
                    <td th:text="${shop.contact}">Contact</td>
                    <td class="truncate" th:text="${shop.socialMediaLinks}" th:title="${shop.socialMediaLinks}">Social Media</td>
                    <td>
                        <a th:href="@{'/shop/' + ${shop.shopId}}" class="btn">View</a>
                        <a th:href="@{'/shop/' + ${shop.shopId} + '/manage'}" class="btn">Manage</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="actions">
        <a th:href="@{/create-shop}" class="btn">Create New Shop</a>
        <a th:href="@{/}" class="btn">Back to Home</a>
    </div>
</div>

<script>
    // Update the form action and placeholder based on selected search type
    const form = document.querySelector('.search-form');
    const radios = document.querySelectorAll('input[name="type"]');

    radios.forEach(radio => {
        radio.addEventListener('change', (e) => {
            const searchInput = document.querySelector('.search-input');
            if (e.target.value === 'tag') {
                searchInput.placeholder = 'Search by tag...';
            } else {
                searchInput.placeholder = 'Search by shop name...';
            }
        });
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const query = document.querySelector('input[name="query"]').value;
        const type = document.querySelector('input[name="type"]:checked').value;
        window.location.href = `/search-results?query=${encodeURIComponent(query)}&type=${type}`;
    });
</script>
</body>
</html>
