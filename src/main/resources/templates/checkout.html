<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout Complete</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
        h1 { color: #059669; margin-bottom: 10px; }
        p { color: #4b5563; margin-bottom: 30px; }
        .btn { background-color: #2563eb; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="card">
    <h1>Order Confirmed!</h1>
    <p>Thank you for your purchase. Your order has been processed.</p>
    <p>Total Paid: <strong><span th:text="${total}">0.00</span></strong></p>
    <br>
    <a href="/" class="btn">Back to Shops</a>
</div>
</body>
</html>
