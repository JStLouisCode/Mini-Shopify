<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Edit Product</h1>
        <p th:text="'Update information for ' + ${product.productName}">Update your product information</p>
    </div>

    <!-- Edit Product Form -->
    <!-- Controller mapping: @PostMapping("/shop/{shopId}/products/{productId}/edit") -->
    <form th:action="@{/shop/{shopId}/products/{productId}/edit(shopId=${shop.shopId}, productId=${product.productID})}"
          th:object="${product}"
          method="post">

        <!-- Product Name -->
        <div class="form-group">
            <label for="productName">Product Name *</label>
            <input type="text" id="productName" th:field="*{productName}" required/>
        </div>

        <!-- Product Description -->
        <div class="form-group">
            <label for="productDescription">Description</label>
            <textarea id="productDescription"
                      th:field="*{productDescription}"
                      rows="4"
                      placeholder="Describe this product..."></textarea>
        </div>

        <!-- Product Price -->
        <div class="form-group">
            <label for="productPrice">Price *</label>
            <input type="number"
                   id="productPrice"
                   th:field="*{productPrice}"
                   step="0.01"
                   min="0"
                   required/>
        </div>

        <!-- Product Category -->
        <div class="form-group">
            <label for="productCategory">Product Category</label>
            <select id="productCategory" th:field="*{productCategory}">
                <option th:each="category : ${allTags}"
                        th:value="${category}"
                        th:text="${category}">
                </option>
            </select>
        </div>

        <!-- Product Inventory -->
        <div class="form-group">
            <label for="productInventory">Inventory</label>
            <input type="number"
                   id="productInventory"
                   th:field="*{productInventory}"
                   min="0"/>
        </div>

        <!-- Picture URL -->
        <div class="form-group">
            <label for="pictureUrl">Picture URL</label>
            <input type="text"
                   id="pictureUrl"
                   th:field="*{pictureUrl}"
                   placeholder="https://example.com/product"/>
        </div>

        <!-- Buttons -->
        <div class="button-group">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a th:href="@{/shop/{shopId}/manage(shopId=${shop.shopId})}" class="btn btn-secondary">Cancel</a>

        </div>
    </form>
</div>
</body>
</html>
