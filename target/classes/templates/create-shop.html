<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create a New Shop</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        select[multiple] {
            height: 150px; /* Give the multi-select box some height */
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Create a New Shop</h1>
    </div>
    <form action="#" th:action="@{/create-shop}" th:object="${shop}" method="post">

        <div class="form-group">
            <label for="name">Shop Name</label>
            <input type="text" id="name" th:field="*{name}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" th:field="*{description}" placeholder="">
        </div>
        <div class="form-group">
            <label for="businessType">Business Type</label>
            <select id="businessType" th:field="*{businessType}">
                <option value="">Select a Business Type</option>
                <option th:each="type : ${allBusinessTypes}"
                        th:value="${type}"
                        th:text="${type}">
                </option>
            </select>
        </div>
        <div class="form-group">
            <label for="tags">Tags</label>
            <select id="tags" th:field="*{tags}" multiple>
                <option th:each="tag : ${allTags}"
                        th:value="${tag}"
                        th:text="${tag}">
                </option>
            </select>
            <small>Hold Ctrl/Cmd to select multiple</small>
        </div>

        <div class="form-group">
            <label for="currency">Currency</label>
            <select id="currency" th:field="*{currency}" required>
                <option value="">Select Currency</option>
                <option th:each="entry : ${allCurrencies}"
                        th:value="${entry.key}"
                        th:text="${entry.value}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="contact">Contact</label>
            <input type="text" id="contact" th:field="*{contact}" placeholder="">
        </div>
        <div class="form-group">
            <label for="socialMediaLinks">Social Media Links</label>
            <input type="text" id="socialMediaLinks" th:field="*{socialMediaLinks}" placeholder="e.g., Instagram, X">
        </div>
        <button type="submit" class="btn">Create Shop</button>
    </form>
</div>
</body>
</html>
